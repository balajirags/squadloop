version: "1.0"
name: "Developer Persona Workflow"
role: "developer"
prompt_file: ".squadloop/agents/developer.md"

initial: recon
steps:
  recon:
    next: plan
  plan:
    next: git_checkout
  git_checkout:
    next: write_tests
  write_tests:
    next: implement_code
  implement_code:
    next: build_verify
  build_verify:
    next: commit_push
  commit_push:
    on_complete: DEV_COMPLETE
